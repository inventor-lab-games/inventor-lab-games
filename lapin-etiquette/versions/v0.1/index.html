</style></head><body><main><header><div><small>LES AVENTURES DE</small><h1>Lapin Étiquette</h1></div><small>v0.1</small></header><p><b>Niveau 1 · La chambre</b> — La petite fille est partie à l’école. Trouve comment ouvrir la porte !</p><div class="layout"><div><div class="room"><svg id="board" viewBox="0 0 576 504" role="img" aria-label="Chambre miniature vue de dessus" xmlns="http://www.w3.org/2000/svg"><defs>

</defs><rect width="576" height="504" fill="url(#wood)"/><rect width="576" height="504" fill="url(#grain)"/><rect x="78" y="298" width="210" height="194" rx="23" fill="url(#rug)" stroke="#eee0ec" stroke-width="7"/><rect x="87" y="307" width="192" height="176" rx="17" fill="none" stroke="#586f9c" stroke-width="2"/><g id="grid"></g>
<g filter="url(#shadow)"><rect x="5" y="5" width="204" height="133" rx="12" fill="#926447"/><rect x="12" y="10" width="190" height="119" rx="8" fill="#fff5e5"/><rect x="21" y="18" width="75" height="42" rx="12" fill="#fff" stroke="#e8d9d7"/><rect x="107" y="18" width="75" height="42" rx="12" fill="#fff" stroke="#e8d9d7"/><rect x="14" y="65" width="186" height="63" rx="8" fill="url(#floral)"/><path d="M14 78H200" stroke="#fbe8e8" stroke-width="5"/>

<rect x="7" y="219" width="59" height="135" rx="6" fill="#c58e68" stroke="#94664e" stroke-width="3"/><path d="M8 262H65M8 307H65" stroke="#875c46" stroke-width="3"/><g fill="#e4a5a1"><rect x="14" y="226" width="9" height="33"/><rect x="37" y="225" width="12" height="34"/></g><g fill="#8ea4bf"><rect x="24" y="229" width="12" height="30"/><rect x="50" y="225" width="9" height="34"/></g><rect x="14" y="270" width="44" height="27" rx="4" fill="#ead2aa"/><circle cx="35" cy="284" r="4" fill="#987047"/><rect x="15" y="316" width="43" height="29" rx="4" fill="#b4b5d4"/>
<rect x="438" y="365" width="132" height="132" rx="10" fill="url(#furn)" stroke="#a27556" stroke-width="3"/><rect x="454" y="379" width="57" height="43" rx="3" fill="#fff8eb" transform="rotate(-7 480 400)"/><path d="M462 390l32 4m-32 5l25 3" stroke="#a6a0bb" stroke-width="2"/><path d="M520 382l22 30" stroke="#bd6b78" stroke-width="5" stroke-linecap="round"/><circle cx="535" cy="448" r="20" fill="#b9a1c8" stroke="#8d799d" stroke-width="4"/><circle cx="535" cy="448" r="12" fill="#e4cedf"/>
<path d="M298 309q9-20 23-10t23 8q15 13-4 24t-37-3z" fill="#83b6c9" fill-opacity=".8" stroke="#6e9eb6" stroke-width="2"/><path d="M306 313q10-8 22-3" fill="none" stroke="#d9eff4" stroke-width="3" stroke-linecap="round"/>
</g><g fill="#aa8469" opacity=".7"><rect x="569" y="0" width="7" height="216"/><rect x="569" y="288" width="7" height="216"/></g><g id="door" filter="url(#shadow)"><rect x="510" y="221" width="61" height="62" rx="4" fill="#a37a58" stroke="#81593f" stroke-width="3"/><rect x="516" y="227" width="49" height="50" rx="3" fill="#d9b08a" stroke="#b18563" stroke-width="2"/><circle cx="522" cy="252" r="5" fill="#ffe6a2" stroke="#9e743e"/></g><g id="stool" filter="url(#shadow)"><rect x="-24" y="-23" width="48" height="49" rx="9" fill="#936043"/><rect x="-27" y="-28" width="54" height="44" rx="10" fill="#e3bd87" stroke="#ac7e52" stroke-width="2"/><rect x="-20" y="-21" width="40" height="30" rx="6" fill="#edcea0"/><path d="M-15 -15Q0 -20 15 -14M-15 2Q0 -3 15 1" stroke="#b98c63" stroke-width="1.3" fill="none"/></g>
<g id="rabbit" filter="url(#shadow)"><ellipse cx="0" cy="23" rx="15" ry="6" fill="#736467" opacity=".23"/><ellipse cx="-3" cy="22" rx="6" ry="12" transform="rotate(19 -3 22)" fill="url(#fur)" stroke="#8198a2"/><ellipse cx="0" cy="6" rx="14" ry="18" fill="url(#fur)" stroke="#8198a2"/><ellipse cx="-13" cy="8" rx="5" ry="12" transform="rotate(20 -13 8)" fill="url(#fur)"/><ellipse cx="13" cy="8" rx="5" ry="12" transform="rotate(-20 13 8)" fill="url(#fur)"/><ellipse cx="-18" cy="-15" rx="8" ry="19" transform="rotate(66 -18 -15)" fill="url(#fur)" stroke="#8198a2"/><ellipse cx="18" cy="-15" rx="8" ry="19" transform="rotate(-66 18 -15)" fill="url(#fur)" stroke="#8198a2"/><ellipse cx="0" cy="-11" rx="15" ry="15" fill="url(#fur)" stroke="#8198a2"/><circle cx="-6" cy="-13" r="1.8" fill="#30343b"/><circle cx="6" cy="-13" r="1.8" fill="#30343b"/><path d="M-5 -7Q0 -10 5 -7L0 -2Z" fill="#c99ca6"/><path d="M0 -2v3m0 0l-3 2m3-2l3 2" stroke="#55606a" fill="none" stroke-width="1"/><g stroke="#eef3f4" stroke-width="1.1" stroke-linecap="round" opacity=".6"><path d="M-9 -19l2 -2M-3 -22l2 -1M4 -20l2 -1M-5 10l2 -2M4 15l2 -2M-8 5l2 -2"/></g></g></svg></div><div class="status" aria-live="polite"><strong id="message"></strong><small id="count"></small></div></div><div class="controls"><div class="pad"><button data-dir="0,-1" aria-label="Haut">↑</button><button data-dir="-1,0" aria-label="Gauche">←</button><button data-dir="0,1" aria-label="Bas">↓</button><button data-dir="1,0" aria-label="Droite">→</button></div><div class="actions"><button id="act">Grimper / ouvrir</button><button class="reset" id="reset">Recommencer</button></div></div></div><p class="hint">Pousse le tabouret en sautant contre lui. Flèches ou boutons pour avancer, espace pour agir. Pas de chronomètre.</p></main><script>
const initial={"x":1,"y":5,"sx":4,"sy":3,"open":false,"on":false,"win":false,"n":0,"msg":"La poignée est trop haute !"};
const blocked=(x,y)=>x<0||x>7||y<0||y>6||(y<2&&(x<3||x>4))||(x===0&&(y===3||y===4))||(x>=6&&y>=5)||(x===7&&y!==3)||(x===4&&y===4);
function move(s,dx,dy){
 if(s.win)return s;
 let x=s.x+dx,y=s.y+dy;
 if(blocked(x,y))return {...s,msg:"Un objet bloque le passage."};
 if(x===7&&y===3&&!s.open)return {...s,msg:"La porte est fermée."};
 if(x===s.sx&&y===s.sy){
   if(s.open&&x===6&&y===3)return {...s,x,y,on:true,n:s.n+1,msg:"Sur le tabouret !"};
   let a=x+dx,b=y+dy;
   if(blocked(a,b)||(a===7&&b===3))return {...s,msg:"Impossible de pousser le tabouret ici."};
   return {...s,x,y,sx:a,sy:b,on:false,n:s.n+1,msg:"Le tabouret avance !"};
 }
 if(x===7&&y===3&&!s.on)return {...s,msg:"Il faut passer par le tabouret."};
 return {...s,x,y,on:false,n:s.n+1,win:x===7&&y===3,msg:x===7&&y===3?"Bravo ! Tu as ouvert la porte !":"Observe les objets autour de toi."};
}
function act(s){
 if(s.win)return s;
 if(s.sx===6&&s.sy===3&&Math.abs(s.x-6)+Math.abs(s.y-3)===1)
 return {...s,x:6,y:3,on:true,open:true,n:s.n+1,msg:"Tu grimpes sur le tabouret et tu abaisses la poignée !"};
 return {...s,msg:"Il faut placer le tabouret juste devant la porte, puis grimper."};
}
let state={...initial};
const grid=document.getElementById('grid');
for(let y=0;y<7;y++)for(let x=0;x<8;x++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x:x*72,y:y*72,width:72,height:72,fill:'none',stroke:'#735c50','stroke-opacity':'.23','stroke-width':'1'}))r.setAttribute(k,v);grid.appendChild(r);}
function render(){document.getElementById('rabbit').setAttribute('transform','translate('+(state.x*72+36)+' '+(state.y*72+36-(state.on?12:0))+')');document.getElementById('stool').setAttribute('transform','translate('+(state.sx*72+36)+' '+(state.sy*72+36)+')');document.getElementById('door').setAttribute('transform',state.open?'translate(35 -5) rotate(-60 540 221)':'');document.getElementById('message').textContent=state.msg;document.getElementById('count').textContent=state.n+' sauts/actions';}
function go(dx,dy){state=move(state,dx,dy);render();}
function action(){state=act(state);render();}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>go(...b.dataset.dir.split(',').map(Number))));document.getElementById('act').onclick=action;document.getElementById('reset').onclick=()=>{state={...initial};render();};document.addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();go(...d)}else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();action()}});render();
</script></body></html>
