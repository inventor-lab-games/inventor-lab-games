function init(level){let s={x:0,y:0,foes:levels[level].enemies.map(e=>({...e})),cloned:false,broken:false,boot:false,skate:false,mitt:false,suction:false,toggle:false,red:0,green:0,blue:0,yellow:0,closed:[],revealed:[],items:0,removed:[],boxes:[],bridges:[],steps:0,turn:0,win:false,hit:false,msg:"",events:[]};levels[level].map.forEach((r,y)=>{[...r].forEach((c,x)=>{if(c==="S"){s.x=x;s.y=y}if(c==="C")s.boxes.push(y*100+x)})});s.boxes.push(...(levels[level].hiddenBoxes||[]));return s}

function gateOpen(l,s,x,y){let link=levels[l].gateLinks?.[y*100+x];return link?link.every(p=>s.boxes.includes(p)||p===s.y*100+s.x):pressed(l,s)}
function pressed(l,s){let targets=[];levels[l].map.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="t")targets.push(y*100+x)}));return targets.length>0&&targets.every(p=>s.boxes.includes(p)||p===s.y*100+s.x)}

function finishTurn(){if(s.hit){busy=true;let token=generation;setTimeout(()=>{if(token!==generation)return;restart();s.msg="Réessaie !";draw()},850)}else if(s.win&&l<campaignEnd()){unlockNext();busy=true;let token=generation;s.msg=l===39?"Bravo ! La sculpture est retrouvée !":"Bravo !";draw();setTimeout(()=>{if(token===generation)restart(l+1)},1050)}else{busy=false;if(s.win){s.msg="Bravo ! Toute l’aventure est terminée !";draw()}}}
function go(dx,dy){if(busy||s.win||paused)return;started=true;let frames=[],final=move(l,s,dx,dy,f=>frames.push(f));if(!frames.length){s=final;draw();playEvents(s.events);return}busy=true;let token=generation,i=0,prior=0;function show(){if(token!==generation)return;if(paused){setTimeout(show,100);return}let f=frames[i++];s=f;draw();playEvents(f.events.slice(prior));prior=f.events.length;if(i<frames.length)setTimeout(show,240);else{s=final;draw();finishTurn()}}show()}
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>go(...b.dataset.d.split(",").map(Number)));document.addEventListener("keydown",e=>{const d={ArrowUp:[0,-1],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();go(...d)}});document.getElementById("wait").onclick=()=>go(0,0);document.getElementById("reset").onclick=()=>restart();document.getElementById("next").onclick=()=>restart(mode);document.getElementById("stage").onchange=()=>{restart(Number(document.getElementById("stage").value));refreshStage()};refreshStage();let fur="";for(let i=0;i<73;i++){let x=Math.sin(i*2.4)*11,y=(i*7%30)-17;fur+='<path d="M'+x+' '+y+'l1.5 -1.5"/>'}document.getElementById("furdetail").innerHTML=fur;draw();
</script></body></html>
